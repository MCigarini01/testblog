<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <title>Login</title>

</head>
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <!-- CSS personale -->
    <link href="../assets/css/main.css" rel="stylesheet">
    <link href="../assets/css/login.css" rel="stylesheet">

<body>
    <!-- Navbar -->
    <div id="navbar-container"></div>

    <div class="container post-container mt-5">
        <!--Freccia per tornare indietro-->
        <a href="index.html" class="back-button"> <i class="bi bi-arrow-left"> </i></a>
        
        <!-- Contenuto principale -->
        <main class="login-page">
            <section class="login-info">
                <img src="../assets/images/logo.png" class="login-info img">
                <h1>Bentornato su MindByte</h1>

                <p>
                    La piattaforma dedicata alla condivisione
                    di contenuti tecnici, didattici e formativi.
                </p>

                <ul>
                    <li>✓ Pubblica articoli</li>
                    <li>✓ Commenta i contenuti</li>
                    <li>✓ Accedi alle risorse della community</li>
                </ul>
            </section>

            <div class="login-container">
                <div class="login-card">
                    <h1>Accedi</h1>

                    <form id="loginForm" method="post">
                        <div class="form-group">
                            <label for="email">Email</label>
                            <input type="email" id="email" required>
                        </div>

                        <div class="form-group">
                            <label for="password">Password</label>
                            <input type="password" id="password" required>
                        </div>

                        <button type="submit">Accedi</button>
                        <p id="loginMessage"></p>
                        <p>Non hai un account?  <a href="register.html">Registrati</a></p>
                        <a href="#">Password dimenticata?</
                    </form>
                </div>
            </div>
        </main>
            
    </div>
    <script type="module" src="../assets/js/components.js"></script>
    <script type="module" src="../assets/js/test/MockLoginApp.js"></script>
    
</body>

</html>
