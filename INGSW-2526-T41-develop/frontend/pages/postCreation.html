<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <title>Articolo</title>

</head>
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <!-- CSS personale -->
    <link href="../assets/css/main.css" rel="stylesheet">
    <link href="../assets/css/postCreation.css" rel="stylesheet">
<body>
    <div class="container py-5">

    <!--Freccia per tornare indietro-->
    <a href="index.html" class="back-button"> <i class="bi bi-arrow-left"> </i></a>
    
        <div class="creation-container">

            <h1>
                Crea Nuovo Post
            </h1>

            <form id="postForm">

                <div class="form-group">

                    <label for="title">
                        Titolo
                    </label>

                    <input
                        type="text"
                        id="title"
                        class="form-control"
                        placeholder="Inserisci il titolo del post"
                        required>

                </div>

                <div class="form-group">

                    <label for="category">
                        Categoria
                    </label>

                    <select
                        id="category"
                        class="form-select">

                        <option value="">
                            Seleziona una categoria
                        </option>

                    </select>

                </div>

                <div class="form-group">

                    <label for="tags">
                        Tag
                    </label>

                <div
                    id="tags"
                    class="tags-selector"
                    role="group"
                    aria-label="Seleziona i tag">
                </div>

                </div>

                <div class="form-group">

                    <label for="image">
                        Immagine di copertina
                    </label>

                    <input
                        type="file"
                        id="image"
                        class="form-control"
                        accept="image/*">

                </div>

                <div class="form-group">

                    <label for="content">
                        Contenuto
                    </label>

                    <textarea
                        id="content"
                        class="form-control"
                        rows="12"
                        placeholder="Scrivi il contenuto del post..."
                        required>

                    </textarea>

                </div>

                <div class="button-group">

                    <button
                        type="button"
                        class="btn btn-secondary"
                        id="cancel-btn">

                        Annulla

                    </button>

                    <button
                        type="submit"
                        class="create-post">

                        Pubblica Post

                    </button>

                </div>

            </form>
                <div
                    id="message-overlay"
                    class="message-overlay"
                    aria-hidden="true">

                    <div
                        id="message"
                        class="message-popup"
                        role="alert"
                        aria-live="assertive">

                        <span
                            id="message-icon"
                            class="message-icon">
                        </span>

                        <p id="message-text"></p>

                        <button
                            type="button"
                            id="message-close"
                            class="message-close">
                            Chiudi
                        </button>
                    </div>
                </div>
        </div>

    </div>

    <script type="module" src="../assets/js/components.js"></script>
    <script type="module" src="../assets/js/PostFormApp.js"></script>
</body>
