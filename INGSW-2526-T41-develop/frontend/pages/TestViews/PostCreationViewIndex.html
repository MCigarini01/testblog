<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <title>Creazione Post</title>
</head>

<body>

    <h1>Nuovo Post</h1>

    <form id="postForm">

        <input
            type="text"
            id="title"
            placeholder="Titolo"
            required>

        <br><br>

        <textarea
            id="content"
            placeholder="Contenuto"
            required>
        </textarea>

        <br><br>

        <button type="submit">
            Pubblica
        </button>

    </form>

    <script
    type="module"
    src="../../assets/js/test/MockPostCreationApp.js">
    </script>

</body>

</html>
