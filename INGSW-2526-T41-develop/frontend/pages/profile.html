<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <title>Il Mio Profilo</title>
</head>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- CSS personale -->
    <link href="../assets/css/main.css" rel="stylesheet">
    <link href="../assets/css/profile.css" rel="stylesheet">


    <!-- Navbar -->
    <div id="navbar-container"></div>

       <!--Freccia per tornare indietro-->
    <a href="index.html" class="back-button"> <i class="bi bi-arrow-left"> </i></a>

<body>
    <div class="profile-container">
    <form id="profileForm">

        <label>
            Username
        </label>

        <input
            id="username"
            type="text"
            required
        >

        <label>
            Email
        </label>

        <input
            id="email"
            type="email"
            required
        >

        <label>
            Nuova Password
        </label>

        <input
            id="password"
            type="password"
        >

        <button
            type="submit"
        >
            Salva Modifiche
        </button>

    </form>

    <div id="successMessage" style="display:none;color:green;"></div>
    <div id="errorMessage" style="display:none;color:red;"></div>

</div>


    <script type="module" src="../assets/js/components.js"></script>
    <script type="module" src="../assets/js/test/MockProfileApp.js"></script>

</body>

</html>
