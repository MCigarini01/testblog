<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Registrati</title>
</head>
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <!-- CSS personale -->
    <link href="../assets/css/main.css" rel="stylesheet">
    <link href="../assets/css/registration.css" rel="stylesheet">

<body>
   <!-- Navbar -->
    <div id="navbar-container"></div>

    <div class="container post-container mt-5">
        <!--Freccia per tornare indietro-->
        <a href="index.html" class="back-button"> <i class="bi bi-arrow-left"> </i></a> 
        
        <!-- Contenuto principale -->
        <main class="registration-page">
                <section class="registration-info">
                    <img src="../assets/images/logo.png" class="login-info img">
                    <h1>Unisciti a MindByte!</h1>

                    <p>
                        La piattaforma dedicata alla condivisione
                        di contenuti tecnici, didattici e formativi.
                    </p>

                    <ul>
                        <li>✓ Pubblica articoli</li>
                        <li>✓ Commenta i contenuti</li>
                        <li>✓ Accedi alle risorse della community</li>
                    </ul>
                </section>

                    <div class="registration-container">
                        <div class="registration-card">
                            <h2>Registrazione</h2>
                            <form id="registrationForm" method="post">
                                <div class="form-group">
                                    <label for="name">
                                        Username
                                    </label>

                                    <input
                                        id="username"
                                        name="username"
                                        type="text"
                                        autocomplete="username"
                                        required
                                    >
                                </div>

                                <div class="form-group">
                                    <label for="email">
                                        Email
                                    </label>

                                    <input
                                        id="email"
                                        name="email"
                                        type="email"
                                        autocomplete="email"
                                        required
                                    >
                                </div>

                                <div class="form-group">
                                    <label for="password">
                                        Password
                                    </label>

                                    <input
                                        id="password"
                                        name="password"
                                        type="password"
                                        autocomplete="new-password"
                                        required
                                        >
                                </div>

                                <div class="form-group">
                                    <label for="confirmPassword">
                                        Conferma password
                                    </label>

                                    <input
                                        id="confirmPassword"
                                        name="confirmPassword"
                                        type="password"
                                        autocomplete="new-password"
                                        required
                                    >
                                </div>

                                <button type="submit">
                                    Registrati
                                </button>

                                <p
                                    id="registrationMessage"
                                    role="status"
                                    aria-live="polite"
                                ></p>
                            </form>

                            <p class="registration-link">
                                Hai già un account?
                                <a href="login.html?" > Accedi </a>
                            </p>
                        </div>
                    </div>
        </main>

    <script type="module" src="../assets/js/components.js"></script>
    <script type="module" src="../assets/js/test/MockRegistrationApp.js"></script>
</body>
</html>
