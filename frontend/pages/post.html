<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <title>Articolo</title>

</head>
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <!-- CSS personale -->
    <link href="../assets/css/main.css" rel="stylesheet">
    <link href="../assets/css/post.css" rel="stylesheet">

<body>
    <!-- Navbar -->
    <div id="navbar-container"></div>

    <div class="container post-container mt-5">
    
    <!--Freccia per tornare indietro-->
    <a href="index.html" class="back-button"> <i class="bi bi-arrow-left"> </i></a>
        
    <!-- Contenuto principale -->
        <div class="container mt-4">
            <div class="row">
                <div class="col-lg-8">
                    <div class="card post-card">
                        <div class="card-body p-5"> 

                            <div id="post-meta" class="d-flex justify-content-between align-items-center text-muted mb-3"></div>
                            <!--Immagine Articolo-->
                            <div class="article-image"><img id="post-image" src="" class="article-image" alt=""></div>
                            <!--Titolo Articolo-->
                            <h1 class="post-title"
                                id="post-title">
                            </h1>
                            <!--Contenuto Articolo-->
                            <div class="post-content"id="post-content"></div>

                            <div id="message"></div>

                            <hr>
                            <!--Commenti-->
                            <h3>Commenti</h3>

                            <div id="comments-container" class=comments-container></div>

                            <form id="commentForm">

                                <textarea
                                    id="commentContent"
                                    class="form-control"
                                    rows="4"
                                    placeholder="Scrivi un commento...">
                                </textarea>

                                <button
                                    type="submit"
                                    class="btn btn-primary mt-3">

                                    Invia

                                </button>

                            </form>
                        </div>
                    </div>
                </div>
            <!--Sidebar-->
            <div class="col-lg-4">
            <div id="sidebar-container"></div>
            </div>

        </div>
    </div>
    <script type="module" src="../assets/js/components.js"></script>
    <script type="module" src="../assets/js/test/MockPostDetailApp.js"></script>
    
</body>

</html>
