<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <title>Dettaglio Post</title>
</head>

<body>

    <div id="post-container">

        <article>

            <h1>Articolo di Test</h1>

            <p>
                Contenuto articolo...
            </p>

        </article>

    </div>

    <hr>

    <h2>Commenti</h2>

    <div id="comments-container">
    </div>

    <h2>Aggiungi un commento</h2>

    <form id="commentForm">

        <textarea
            id="commentContent"
            placeholder="Scrivi il tuo commento..."
            required>
        </textarea>

        <br><br>

        <button type="submit">
            Invia Commento
        </button>

    </form>

    <br>

    <div id="message"></div>

     <script
    type="module"
    src="../../assets/js/test/MockPostDetailApp.js">
    </script>

</body>

</html>
