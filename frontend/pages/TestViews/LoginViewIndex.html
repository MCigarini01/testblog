<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <title>Login</title>
</head>

<body>

    <h1>Login</h1>

    <form id="loginForm">

        <input
            type="text"
            id="username"
            placeholder="Username"

    <br>

    <div id="message"></div>

    <script
    type="module"
    src="../../assets/js/test/MockLoginApp.js">
    </script>

</body>

</html>
